seed: 42

# --------------------------------------------------------------------------
# PPO: fields match skrl 2.x's `skrl.agents.torch.ppo.PPO_CFG` dataclass.
# `lambda` -> `gae_lambda`. `clip_predicted_values` no longer exists as a
# separate flag (value clipping is controlled purely by `value_clip`).
# --------------------------------------------------------------------------
agent:
  rollouts: 16
  learning_epochs: 8
  mini_batches: 4
  discount_factor: 0.99
  gae_lambda: 0.95
  learning_rate: 1.0e-3
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 1.0
  ratio_clip: 0.2              # PPO surrogate clipping range
  value_clip: 0.2
  entropy_loss_scale: 0.00   #0.0
  value_loss_scale: 1.0
  kl_threshold: 0.0
  time_limit_bootstrap: true
  experiment:
    directory: "dofbot_reacher_ppo"
    write_interval: 200
    checkpoint_interval: 2000

trainer:
  timesteps: 400000 #200000 
